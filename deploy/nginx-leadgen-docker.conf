# ============================================================
# nginx config per leadgen-engine — DOCKER mode
# Path destinazione VPS: /opt/leadgen-engine/nginx-leadgen.conf
# Mount in container astro-funnel-nginx-1 come /etc/nginx/conf.d/leadgen.conf:ro
# ============================================================

# HTTP — ACME challenge + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name leadgen.trackitwhen.com;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 190.93.240.0/20;
    real_ip_header CF-Connecting-IP;

    # Webroot per certbot (riusa lo stesso del setup astro-funnel)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot-webroot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leadgen.trackitwhen.com;

    # SSL — certificati Let's Encrypt montati nel container nginx
    ssl_certificate     /etc/letsencrypt/live/leadgen.trackitwhen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadgen.trackitwhen.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_leadgen:10m;
    ssl_session_timeout 1d;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 190.93.240.0/20;
    real_ip_header CF-Connecting-IP;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2M;

    # Logging dedicato (path nel container)
    access_log /var/log/nginx/leadgen-access.log;
    error_log  /var/log/nginx/leadgen-error.log warn;

    # Upstream: il container leadgen-engine sulla network astro-funnel_default
    location / {
        proxy_pass http://leadgen-engine:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static asset caching Next.js
    location /_next/static/ {
        proxy_pass http://leadgen-engine:3010;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
