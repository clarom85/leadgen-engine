# ============================================================
# nginx config per leadgen-engine
# Path destinazione VPS: /etc/nginx/sites-available/leadgen-engine
# Subdomain: leadgen.vireonmedia.com → 127.0.0.1:3010
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name leadgen.vireonmedia.com;

    # Redirect HTTP → HTTPS (dopo certbot setup)
    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge per Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leadgen.vireonmedia.com;

    # SSL — gestiti da certbot, vengono iniettati automaticamente
    # ssl_certificate /etc/letsencrypt/live/leadgen.vireonmedia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leadgen.vireonmedia.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Body size — accetta payload lead (TrustedForm cert può essere grosso)
    client_max_body_size 2M;

    # Logging dedicato
    access_log /var/log/nginx/leadgen-access.log;
    error_log /var/log/nginx/leadgen-error.log warn;

    # Reverse proxy verso Next.js su porta 3010
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts adatti al ping-tree (max ping 2.5s × buyer + buffer)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static asset caching (Next.js)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
