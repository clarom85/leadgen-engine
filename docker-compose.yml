version: "3.8"

# ============================================================
# Leadgen Engine — Docker compose
# Si connette al network astro-funnel_default (esterno) per
# essere raggiungibile da astro-funnel-nginx-1
# ============================================================

services:
  leadgen-engine:
    build:
      context: .
      args:
        NEXT_PUBLIC_TRUSTEDFORM_ENABLED: ${NEXT_PUBLIC_TRUSTEDFORM_ENABLED:-}
        NEXT_PUBLIC_JORNAYA_ACCOUNT_ID: ${NEXT_PUBLIC_JORNAYA_ACCOUNT_ID:-}
        NEXT_PUBLIC_LEADGEN_DEBUG: ${NEXT_PUBLIC_LEADGEN_DEBUG:-}
    container_name: leadgen-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      PING_TIMEOUT_MS: ${PING_TIMEOUT_MS:-2500}
      MAX_PARALLEL_PINGS: ${MAX_PARALLEL_PINGS:-20}
      TRUSTEDFORM_API_KEY: ${TRUSTEDFORM_API_KEY:-}
      JORNAYA_ACCOUNT_ID: ${JORNAYA_ACCOUNT_ID:-}
      # Gate mock buyer endpoints. Set to 'false' (or unset) in production
      # once real buyer integrations are live. Default 'true' for current dev.
      LEADGEN_MOCK_BUYERS: ${LEADGEN_MOCK_BUYERS:-true}
      # NOTE: NEXT_PUBLIC_* env vars sono inline al build time in Next.js.
      # Per attivare TF/Jornaya client-side, passarle come build args
      # (vedi Dockerfile) e rebuildare l'immagine.
    ports:
      # Bind solo a localhost — nginx in container raggiunge via network condivisa
      - "127.0.0.1:3010:3010"
    networks:
      - astro_default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3010/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  astro_default:
    name: astro-funnel_default
    external: true
